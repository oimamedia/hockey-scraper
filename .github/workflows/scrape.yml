name: Hockey scraper

on:
  workflow_dispatch:
  schedule:
    # Ajaa joka päivä klo 07:00 UTC (10:00 Suomen aikaa talvella)
    - cron: "0 7 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scrape.js

      - name: Show output
        run: cat data.json

      - name: Upload data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hockey-data-${{ github.run_id }}
          path: data.json
          retention-days: 30

      - name: Commit data.json back to repo (optional)
        # Poista tämä step jos et halua commitoida dataa repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update hockey data [skip ci]"
          git push
