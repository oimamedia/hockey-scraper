name: Hockey scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scrape.js

      - name: Show output
        run: cat data.json

      - name: Upload data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hockey-data-${{ github.run_id }}
          path: data.json
          retention-days: 30
