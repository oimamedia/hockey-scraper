name: Scrape Games

on:
  schedule:
    - cron: "0 * * * *"   # joka tunti
  workflow_dispatch:        # manuaalinen ajo napista

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape games
        run: node scrape-games.js

      - name: Commit games.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games.json
          git diff --staged --quiet || git commit -m "chore: update games [skip ci]"
          git push
